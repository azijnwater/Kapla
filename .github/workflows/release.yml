name: Windows release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION ($version)."
          }

      - name: Test, build, and package Kapla
        shell: pwsh
        run: .\package-release.ps1

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: Kapla-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          path: |
            release/Kapla-*-windows-x64-portable.zip
            release/Kapla-*-checksums.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          $tag = "v$version"
          $assets = @(
            ".\release\Kapla-$version-windows-x64-portable.zip",
            ".\release\Kapla-$version-checksums.txt"
          )

          # The release may already have been created in GitHub's web UI.
          # Reuse it and replace its generated assets instead of failing.
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --verify-tag --generate-notes --title "Kapla $version"
          }
