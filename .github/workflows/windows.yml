name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run regression tests
        shell: pwsh
        run: .\Tests\run-tests.ps1

      - name: Build Kapla
        shell: pwsh
        run: .\build.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Kapla-windows
          if-no-files-found: error
          path: |
            outputs/Kapla.exe
            outputs/Launch-Kapla.cmd
            outputs/Assets/**
